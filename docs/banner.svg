<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0e14"/>
      <stop offset="100%" style="stop-color:#141622"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c6ff7"/>
      <stop offset="100%" style="stop-color:#4dd6c1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6ff7;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#4dd6c1;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Glow orb -->
  <ellipse cx="600" cy="200" rx="380" ry="180" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Avatar circle (left side) -->
  <circle cx="260" cy="200" r="90" fill="#1a1b2e" stroke="#7c6ff7" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="260" cy="175" r="30" fill="#2a2b3e"/>
  <ellipse cx="260" cy="235" rx="45" ry="25" fill="#2a2b3e"/>
  <!-- Face details -->
  <circle cx="248" cy="170" r="4" fill="#7c6ff7" opacity="0.8"/>
  <circle cx="272" cy="170" r="4" fill="#7c6ff7" opacity="0.8"/>
  <path d="M248 183 Q260 191 272 183" fill="none" stroke="#4dd6c1" stroke-width="2" stroke-linecap="round"/>
  <!-- Pulse rings -->
  <circle cx="260" cy="200" r="100" fill="none" stroke="#7c6ff7" stroke-width="0.8" stroke-opacity="0.3"/>
  <circle cx="260" cy="200" r="115" fill="none" stroke="#7c6ff7" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Connection dots (branching lines on right) -->
  <g opacity="0.6">
    <!-- Branch lines -->
    <line x1="780" y1="160" x2="900" y2="120" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="780" y1="200" x2="900" y2="200" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="780" y1="240" x2="900" y2="280" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="900" y1="120" x2="1000" y2="100" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.25"/>
    <line x1="900" y1="120" x2="1000" y2="140" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.25"/>
    <line x1="900" y1="280" x2="1000" y2="260" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.25"/>
    <line x1="900" y1="280" x2="1000" y2="300" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.25"/>
    <!-- Nodes -->
    <circle cx="780" cy="160" r="7" fill="#7c6ff7" opacity="0.7"/>
    <circle cx="780" cy="200" r="7" fill="#7c6ff7" opacity="0.9"/>
    <circle cx="780" cy="240" r="7" fill="#7c6ff7" opacity="0.7"/>
    <circle cx="900" cy="120" r="5" fill="#4dd6c1" opacity="0.7"/>
    <circle cx="900" cy="200" r="5" fill="#4dd6c1" opacity="0.9"/>
    <circle cx="900" cy="280" r="5" fill="#4dd6c1" opacity="0.7"/>
    <circle cx="1000" cy="100" r="4" fill="#ffffff" opacity="0.3"/>
    <circle cx="1000" cy="140" r="4" fill="#ffffff" opacity="0.3"/>
    <circle cx="1000" cy="260" r="4" fill="#ffffff" opacity="0.3"/>
    <circle cx="1000" cy="300" r="4" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Main title -->
  <text x="600" y="170" font-family="system-ui,-apple-system,sans-serif" font-size="72" font-weight="700" letter-spacing="-3" text-anchor="middle" fill="url(#accent)">FirstRound</text>

  <!-- Tagline -->
  <text x="600" y="218" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="400" letter-spacing="0" text-anchor="middle" fill="#ffffff" opacity="0.7">AI avatar first-round screening interviews</text>

  <!-- Pills / tags -->
  <rect x="430" y="248" width="120" height="28" rx="14" fill="#7c6ff7" fill-opacity="0.18" stroke="#7c6ff7" stroke-opacity="0.4" stroke-width="1"/>
  <text x="490" y="267" font-family="system-ui,-apple-system,sans-serif" font-size="12" text-anchor="middle" fill="#b3adf7">Perxona Avatar</text>

  <rect x="560" y="248" width="100" height="28" rx="14" fill="#4dd6c1" fill-opacity="0.12" stroke="#4dd6c1" stroke-opacity="0.35" stroke-width="1"/>
  <text x="610" y="267" font-family="system-ui,-apple-system,sans-serif" font-size="12" text-anchor="middle" fill="#4dd6c1">DeepSeek LLM</text>

  <rect x="670" y="248" width="100" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  <text x="720" y="267" font-family="system-ui,-apple-system,sans-serif" font-size="12" text-anchor="middle" fill="#ffffff" opacity="0.5">Node + Express</text>

  <!-- Bottom bar -->
  <rect x="0" y="390" width="1200" height="10" fill="url(#accent)" opacity="0.6"/>
</svg>
