<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Candidates — FirstRound</title>
    <link rel="stylesheet" href="/css/app.css" />
    <style>
      .reviews {
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .cand-list { display: grid; gap: 8px; }
      .cand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        cursor: pointer;
        text-align: left;
        color: inherit;
        font: inherit;
        width: 100%;
        transition: border-color .14s, background .14s;
      }
      .cand:hover { border-color: var(--border-strong); background: var(--surface-2); }
      .cand[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .cand-score {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-weight: 680;
        font-size: 14px;
        flex-shrink: 0;
        background: var(--surface-3);
      }
      .cand-main { min-width: 0; flex: 1; }
      .cand-main strong {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cand-main span { font-size: 11.5px; color: var(--muted); }
      @media (max-width: 1080px) {
        .reviews { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="shell" id="shell">
      <main class="main" id="main"></main>
    </div>
    <script type="module" src="/js/reviews.js"></script>
  </body>
</html>
