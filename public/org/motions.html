<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avatar & motion — FirstRound</title>
    <link rel="stylesheet" href="/css/app.css" />
    <style>
      .motion-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 392px;
        gap: 16px;
        align-items: start;
      }
      .preview-card { position: sticky; top: 24px; padding: 0; overflow: hidden; }
      .preview-stage {
        position: relative;
        aspect-ratio: 3 / 4;
        background: radial-gradient(600px 420px at 50% 25%, #17172c, #08080d 72%);
      }
      .preview-stage sv-presenter { position: absolute; inset: 0; width: 100%; height: 100%; }
      .preview-idle {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
        gap: 14px;
      }
      .preview-foot { padding: 15px; border-top: 1px solid var(--border); }
      .avatar-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 9px;
        max-height: 260px;
        overflow-y: auto;
        padding: 3px;
      }
      .avatar-tile {
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        background: var(--surface-2);
        padding: 7px;
        cursor: pointer;
        display: grid;
        gap: 6px;
        justify-items: center;
        color: inherit;
        font: inherit;
        transition: border-color .14s, background .14s;
      }
      .avatar-tile:hover { border-color: var(--border-strong); }
      .avatar-tile[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .avatar-tile img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: var(--r-sm);
        background: var(--bg-glow);
      }
      .avatar-tile span {
        font-size: 10.5px;
        color: var(--muted);
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        width: 100%;
      }
      .scene-tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 9px;
        max-height: 300px;
        overflow-y: auto;
        padding: 3px;
      }
      .scene-tile {
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        background: var(--surface-2);
        padding: 7px;
        cursor: pointer;
        display: grid;
        gap: 6px;
        color: inherit;
        font: inherit;
        text-align: left;
        transition: border-color .14s, background .14s;
      }
      .scene-tile:hover { border-color: var(--border-strong); }
      .scene-tile[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .scene-tile img {
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        border-radius: var(--r-sm);
        background:
          repeating-conic-gradient(#1a1a24 0% 25%, #12121a 0% 50%) 50% / 14px 14px;
      }
      .scene-tile span {
        font-size: 10.5px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tile[disabled] { opacity: .45; cursor: not-allowed; }
      @media (max-width: 1180px) {
        .motion-layout { grid-template-columns: 1fr; }
        .preview-card { position: static; }
      }
    </style>
  </head>
  <body>
    <div class="shell" id="shell">
      <main class="main" id="main"></main>
    </div>
    <script type="module" src="/js/motions.js"></script>
  </body>
</html>
